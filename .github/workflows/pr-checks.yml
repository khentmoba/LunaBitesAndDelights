name: PR Checks
# Regression gate: every PR must pass type checks, tests and builds
# before merge.
# Protect `main` (Settings → Branches → Require status checks) with:
#   site / functions / rules
on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Lint (promise checks)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Report outdated npm deps (informational)
        run: npm outdated || true

      # Runtime deps only, as in the site job: dev tooling never ships, and
      # typescript-eslint pulls picomatch, whose ReDoS advisory has no fixed release yet.
      - name: Fail on high/critical runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The emulator scripts resolve firebase-tools from the root lockfile and
      # use npx --no-install so CI cannot fall back to an unpinned download.
      - run: npm ci
        working-directory: .

      - run: npm ci

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

      - name: Derived views tests (Functions + Firestore emulators)
        run: npm run test:derived

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: app

      - name: Astro type check
        run: npm run check
        working-directory: app

      - name: Lint (promise checks)
        run: npm run lint
        working-directory: app

      - name: Build the storefront
        run: npm run build
        working-directory: app

      - name: Fail on high/critical runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

      - name: Storefront tests
        run: npm run test:site

      - name: Verify PR proof and attribution
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            export CHANGED_FILES
          fi
          node tool/check_pr_proof.mjs
