name: PR Checks
# Regression gate: every PR must pass analyze + tests + builds + proof before merge.
# Protect `main` (Settings → Branches → Require status checks) with:
#   flutter / functions / rules / proof
on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for changed-files format check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Analyze (errors fail; new info/warning issues fail)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt
          node tool/check_analyzer_baseline.mjs analyze.txt

      - name: Format check (changed files only)
        run: |
          FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- '*.dart')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs dart format --output=none --set-exit-if-changed
          else
            echo "no Dart files changed"
          fi

      - name: Regression tests
        run: flutter test

      - name: Report outdated Flutter deps (informational)
        run: flutter pub outdated

      - name: Web build still compiles
        run: flutter build web --release

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Report outdated npm deps (informational)
        run: npm outdated || true

      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require proof for product changes (AGENTS.md)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          export CHANGED_FILES
          node tool/check_pr_proof.mjs
