name: PR Checks
# Regression gate: every PR must pass analyze + tests + builds
# before merge.
# Protect `main` (Settings → Branches → Require status checks) with:
#   flutter / functions / rules
on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # needed for changed-files format check

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get

      - name: Analyze (errors fail; new info/warning issues fail)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 \
            | tee analyze.txt
          node tool/check_analyzer_baseline.mjs analyze.txt

      - name: Format check (changed files only)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          FILES=$(git diff --name-only --diff-filter=d \
            "origin/$BASE_REF...HEAD" -- '*.dart')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs dart format --output=none \
              --set-exit-if-changed
          else
            echo "no Dart files changed"
          fi

      - name: Regression tests
        run: flutter test

      - name: Report outdated Flutter deps (informational)
        run: flutter pub outdated

      - name: Web build still compiles
        run: flutter build web --release

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Report outdated npm deps (informational)
        run: npm outdated || true

      - name: Fail on high/critical vulnerabilities
        run: npm audit --audit-level=high

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Storefront script tests
        run: npm run test:site
