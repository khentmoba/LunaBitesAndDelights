name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            app/package-lock.json

      - run: npm ci
        working-directory: app

      # The kiosk reads these at build time: App Check's reCAPTCHA Enterprise
      # site key and the MapTiler key for the delivery map. Both are public
      # browser keys, kept as secrets so forks do not build with them.
      - run: npm run build
        working-directory: app
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          PUBLIC_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
          projectId: lunaexpress
          target: app-site
