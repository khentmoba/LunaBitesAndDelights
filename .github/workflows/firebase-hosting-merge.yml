name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            app/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: app

      # The kiosk reads these at build time: App Check's reCAPTCHA Enterprise
      # site key and the Google Maps browser key for the delivery map. Both are
      # public browser keys, kept as secrets so forks do not build with them.
      - run: npm run build
        working-directory: app
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
          PUBLIC_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

      # Pinned to the v0 commit; a mutable tag would run unreviewed code with
      # the production deploy credentials below.
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
          channelId: live
          projectId: lunaexpress
          target: app-site

      # Fails the deploy if a live entry URL loops or does not end in a 200.
      # A redirect loop on /kiosk/ shipped once (Safari: "Load cannot follow
      # more than 20 redirections"); the local emulator did not catch it.
      - name: Smoke-test live URLs (no redirect loops)
        run: |
          set -u
          fail=0
          for path in / /menu /menu/ /kiosk /kiosk/ /kiosk/menu/ /kiosk/sw.js /staff/ /payment/success/ /payment/cancel/; do
            url="https://lunabitesanddelights.web.app$path"
            code=$(curl -sS -o /dev/null -L --max-redirs 3 -w '%{http_code}' "$url" || echo loop)
            echo "$url -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      # The legacy `lunaexpress` site now only serves 301 redirects to the
      # canonical `lunabitesanddelights` site, so it is deployed separately.
      - name: Deploy legacy redirect site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx --no-install firebase-tools deploy --only hosting:lunaexpress --project lunaexpress --non-interactive

      # Secrets (TELEGRAM_*, PAYMONGO_*) are read from Secret Manager at runtime
      # (see functions/src/index.ts). Set values once via:
      #   firebase functions:secrets:set TELEGRAM_TOKEN (etc.)
      # No .env file needed — never commit secret values.

      # No delete-before-deploy step: a deploy that fails after a delete leaves the
      # functions missing (incident 2026-11-05, see docs/evidence/functions-runtime-node22.md).
      # `--force` removes only functions that are no longer in source.
      - name: Deploy Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LUNAEXPRESS }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx --no-install firebase-tools deploy --only functions --project lunaexpress --non-interactive --force
