<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment Received — Luna Bites &amp; Delights</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ec1c72">
<style>
:root{--pink:#ec1c72;--pink-plate:#d91566;--pink-press:#b30e52;--blush:#feb7c9;--paper:#fffafb;--ink:#2a0f1e;--ink-soft:#6b3a52;--print:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--blush);color:var(--ink);font-family:var(--print);line-height:1.55}
.card{max-width:460px;width:100%;padding:32px 28px;background:var(--paper);border-top:4px solid var(--pink);box-shadow:0 16px 26px -18px rgba(110,4,50,.45);text-align:center}
h1{margin:0 0 10px;font-size:1.75rem;line-height:1.15}
p{margin:0 0 22px;color:var(--ink-soft)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:6px;background:var(--pink-plate);color:#fff;font-weight:750;text-decoration:none}
.btn:hover{background:var(--pink-press)}
.btn--line{background:transparent;color:var(--pink-press);box-shadow:inset 0 0 0 2px var(--pink-press)}
</style>
</head>
<body>
<main class="card">
<h1>GCash payment received</h1>
<p>Return to your Luna Bites &amp; Delights tab to view your order receipt, or open the ordering app below.</p>
<div class="actions">
<a class="btn" href="/kiosk/#/menu">Back to ordering app</a>
<a class="btn btn--line" href="/">Back to storefront</a>
</div>
</main>
</body>
</html>
